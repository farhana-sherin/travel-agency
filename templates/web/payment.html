<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Complete Payment</title>
  <script src="https://js.stripe.com/v3/"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Customize Stripe Element styles */
    .StripeElement {
      padding: 12px;
      border: 1px solid #d1d5db; /* Tailwind gray-300 */
      border-radius: 0.375rem; /* rounded-md */
      background-color: white;
      box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.05);
      transition: border-color 0.3s ease;
    }
    .StripeElement--focus {
      border-color: #2563eb; /* Tailwind blue-600 */
      box-shadow: 0 0 0 1px #2563eb;
    }
    .StripeElement--invalid {
      border-color: #dc2626; /* Tailwind red-600 */
      box-shadow: 0 0 0 1px #dc2626;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white shadow-lg rounded-lg max-w-md w-full p-8">
    <h1 class="text-3xl font-extrabold text-gray-900 mb-6 text-center">Complete Your Payment</h1>

    <div id="card-element" class="StripeElement mb-4"></div>
    <div id="card-errors" role="alert" class="text-red-600 mb-4 min-h-[1.5rem]"></div>

    <button id="pay-button" 
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg shadow transition-colors duration-300">
      Pay Now
    </button>
  </div>

  <script>
    const stripe = Stripe("pk_test_51RtMCkJq2bwomePhDDd6aTF4NFF0nFL4zSDO62WIHum44U3hKcOjfuf2WQVw78D2iKD0xg3jSkZojR9zTjgPdJJe007Myz6BAp");
    const elements = stripe.elements();

    const card = elements.create('card');
    card.mount('#card-element');

    card.on('change', (event) => {
      const displayError = document.getElementById('card-errors');
      if (event.error) {
        displayError.textContent = event.error.message;
      } else {
        displayError.textContent = '';
      }
    });

    document.getElementById('pay-button').addEventListener('click', async () => {
      const response = await fetch("{% url 'web:create_payment_intent' booking.id %}", {
        method: "POST",
        headers: {
          "X-CSRFToken": "{{ csrf_token }}"
        }
      });
      const data = await response.json();

      if (data.error) {
        alert(data.error);
        return;
      }

      const result = await stripe.confirmCardPayment(data.client_secret, {
        payment_method: {
          card: card
        }
      });

      if (result.error) {
        alert(result.error.message);
      } else {
        if (result.paymentIntent.status === 'succeeded') {
          await fetch("{% url 'web:payment_success' booking.id %}", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "X-CSRFToken": "{{ csrf_token }}"
            },
            body: JSON.stringify({
              payment_intent_id: result.paymentIntent.id
            })
          });

          window.location.href = "{% url 'web:booking_details' %}";
        }
      }
    });
  </script>
</body>
</html>
