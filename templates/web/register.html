{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Fady Travel - Register</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-cover bg-center bg-no-repeat" style="background-image: url('static/images/bg-1.png');">

  <div class="flex items-center justify-center min-h-screen bg-black bg-opacity-60">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-[400px] p-10">
      <h2 class="text-3xl font-bold text-center text-red-600 mb-6">Create Account</h2>

      <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">First Name</label>
          <input type="text" name="first_name" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-red-400">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">Last Name</label>
          <input type="text" name="last_name" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-red-400">
        </div>
       
        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">Email</label>
          <input type="email" name="email" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-red-400">
        </div>

        <div class="mb-4">
          <label class="block text-sm font-semibold mb-1">Password</label>
          <input type="password" name="password" required class="w-full px-4 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-red-400">
        </div>

        <button type="submit" class="w-full bg-red-500 hover:bg-red-600 text-white font-semibold py-2 rounded transition">Register</button>
      </form>
      {% if error %}
        <p class="mt-5 text-[15px] text-red-500">{{ message }}</p>
      {% endif %}
      <p class="text-center text-sm mt-4 text-gray-600">Already have an account? 
        <a href="{% url 'web:login' %}" class="text-red-500 font-semibold hover:underline">Login</a>
      </p>
    </div>
  </div>
</body>
</html>
