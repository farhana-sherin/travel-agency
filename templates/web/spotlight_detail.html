<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ spotlight.title }} - Traveler Spotlight</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

<div class="max-w-6xl mx-auto px-4 py-12">

    <!-- Hero Section -->
    <div class="relative rounded-3xl overflow-hidden shadow-xl">
        <img src="{{ spotlight.image.url }}" alt="{{ spotlight.title }}" class="w-full h-[500px] object-cover">
        <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent"></div>

        <!-- Title Overlay -->
        <div class="absolute bottom-0 left-0 p-8 text-white">
            <span class="bg-amber-500 text-black px-4 py-1 rounded-full text-sm font-semibold uppercase tracking-wide">
                Traveler Spotlight
            </span>
            <h1 class="mt-4 text-5xl font-extrabold leading-tight drop-shadow-lg">{{ spotlight.title }}</h1>
        </div>
    </div>

    <!-- Content -->
    <div class="bg-white mt-10 p-10 rounded-3xl shadow-lg">
        <p class="text-lg text-gray-700 leading-relaxed mb-8">{{ spotlight.full_description }}</p>

        <div class="flex items-center justify-between border-t border-gray-200 pt-6">
            <div>
                <p class="text-gray-500 text-sm">Featured Destination</p>
                <p class="text-gray-900 font-semibold">{{ spotlight.title }}</p>
            </div>
            <a href="{% url 'web:spotlight_list' %}" 
               class="px-6 py-3 bg-gradient-to-r from-amber-500 to-orange-500 text-white font-medium rounded-full shadow-md hover:from-amber-600 hover:to-orange-600 transition duration-300">
                ← Back to Spotlights
            </a>
        </div>
    </div>

</div>

</body>
</html>
