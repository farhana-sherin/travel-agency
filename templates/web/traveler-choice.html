{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>{{ choice.name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      /* Smooth image zoom on hover */
      .img-zoom {
        transition: transform 0.7s cubic-bezier(.2,.9,.2,1);
      }
      .group:hover .img-zoom {
        transform: scale(1.05);
      }
    </style>
</head>
<body class="bg-gray-50 font-serif min-h-screen text-gray-800">

<div class="max-w-6xl mx-auto px-6 py-12">

    <!-- Image with subtle zoom & warm overlay -->
    <div class="relative group rounded-3xl overflow-hidden shadow-2xl">
        <img src="{{ choice.image.url }}" alt="{{ choice.name }}"
             class="w-full h-[450px] object-cover img-zoom">
        <div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent rounded-3xl"></div>
        <div class="absolute bottom-6 left-8 text-white drop-shadow-lg">
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight">{{ choice.name }}</h1>
            <p class="mt-1 text-lg opacity-90 font-medium">{{ choice.location }}</p>
        </div>
    </div>

    <!-- Details Card -->
    <div class="mt-12 bg-white rounded-2xl shadow-xl p-10">
        <!-- Rating -->
        <div class="flex items-center mb-6">
            <span class="text-amber-400 text-3xl mr-2">⭐</span>
            <span class="text-xl font-semibold text-gray-900">{{ choice.rating }}/5.0</span>
        </div>

        <!-- Full Description -->
        <div class="text-gray-700 leading-relaxed text-lg">
            {{ choice.full_description }}
        </div>

        <!-- Back Button -->
        <div class="mt-12">
            <a href="{% url 'web:travelers_choice_list' %}"
               class="inline-flex items-center gap-3 px-7 py-3 rounded-full bg-gradient-to-r from-amber-500 to-orange-500 text-white font-semibold shadow-lg hover:brightness-110 transition transform duration-300">
                ← Back to Traveler's Choices
            </a>
        </div>
    </div>
</div>

</body>
</html>
